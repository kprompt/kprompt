sonar.organization=kprompt
sonar.projectKey=kprompt_kprompt
sonar.projectName=kprompt

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/mocks/**,**/mock/**,charts/**,deploy/**,docs/**,ide/**,test/e2e/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

# Go coverage and test reports (generated by CI)
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=report.json

sonar.sourceEncoding=UTF-8
