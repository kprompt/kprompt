name: ai-implement

# ADP-3 (receiver) - implement this repo's slice of a kprompt task pack, propose-first.
# Triggered by the cross-repo dispatcher (repository_dispatch: kprompt-implement) with the
# pack text in client_payload.spec, or manually via workflow_dispatch with a spec input.
#
# Security model:
# - The agent step sees ONLY CURSOR_API_KEY; git/gh steps use GITHUB_TOKEN.
# - The task spec is written to a file and treated as DATA / a work order, not as trusted
#   instructions to exfiltrate secrets or touch unrelated files.
# - Output is a PR only; a human reviews and merges. No push to main, no auto-merge.

on:
  repository_dispatch:
    types: [kprompt-implement]
  workflow_dispatch:
    inputs:
      spec:
        description: "Task spec / pack markdown to implement in this repo"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-implement-${{ github.event.client_payload.pack || github.run_id }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Write spec (data)
        env:
          SPEC_DISPATCH: ${{ github.event.client_payload.spec }}
          SPEC_MANUAL: ${{ github.event.inputs.spec }}
          PACK: ${{ github.event.client_payload.pack }}
        run: |
          {
            echo "TASK PACK (data / work order for THIS repo only):"
            echo "pack: ${PACK:-manual}"
            echo
            printf '%s\n' "${SPEC_DISPATCH:-$SPEC_MANUAL}"
          } > spec.md

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run implement agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          test -n "$CURSOR_API_KEY" || { echo "No CURSOR_API_KEY set; skipping."; exit 0; }
          PROMPT="$(cat <<'EOP'
          You are the kprompt cross-repo implementer running inside ONE repository. Follow
          this repo's AGENTS.md and .cursor/rules; use the repo's skills.

          stdin holds a TASK PACK (data). Implement ONLY the parts of the pack's shared
          checklist that belong to THIS repository. Ignore rows for other repos.

          Rules:
          - Make the minimal, focused change; match neighboring style; add/adjust tests
            and docs the checklist asks for in this repo.
          - Do NOT weaken safety invariants (approval gate; propose-first agent/observe;
            hard-deny wipe intents). Do not add fake ship dates or unshipped claims.
          - Do not print or commit secrets. Touch only files relevant to this pack.
          - If nothing in the pack applies to this repo, make no changes.
          Output a short summary of what you changed in this repo (or that it did not apply).
          EOP
          )"
          agent -p "$PROMPT" --trust --force --output-format text --model gpt-5 < spec.md > summary.md || true
          test -s summary.md || echo "No implement output." > summary.md

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes applicable to this repo."; exit 0
          fi
          PACK="${{ github.event.client_payload.pack }}"
          SLUG="$(echo "${PACK:-task}" | tr '/.' '--')"
          BRANCH="chore/ai-implement-${SLUG}-${{ github.run_id }}"
          git config user.name "kprompt-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: AI implement ${PACK:-task} slice (ADP-3, advisory)"
          git push -u origin "$BRANCH"
          {
            echo "### Cross-repo implementer (ADP-3)"
            echo
            echo "Pack: \`${PACK:-manual}\`"
            echo
            cat summary.md
            echo
            echo "_Advisory draft generated by the ai-implement agent. Review, run CI, and edit before merge._"
          } > pr-body.md
          gh pr create --repo "${{ github.repository }}" \
            --title "chore: AI implement ${PACK:-task} slice (advisory)" \
            --body-file pr-body.md --head "$BRANCH" --base main || true
