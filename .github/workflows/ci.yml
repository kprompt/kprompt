name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame and new-code analysis
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test with coverage
        run: go test -json -coverprofile=coverage.out -covermode=atomic ./... > report.json || true
      - name: Build
        run: go build -o bin/kprompt ./cmd/kprompt
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Team SCM demo (A-065 / A-069): stub PlanResult upload when org token is set.
  # Never applies to a cluster. Skips cleanly without KPROMPT_ORG_TOKEN.
  report-plan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Upload PlanResult to kprompt Team
        env:
          KPROMPT_ORG_TOKEN: ${{ secrets.KPROMPT_ORG_TOKEN }}
          API_URL: ${{ vars.KPROMPT_API_URL || 'https://api.kprompt.ai' }}
        run: |
          if [ -z "${KPROMPT_ORG_TOKEN}" ]; then
            echo "KPROMPT_ORG_TOKEN not set — skip Team PlanResult upload"
            exit 0
          fi
          BODY=$(jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg summary "ci stub plan (${GITHUB_WORKFLOW})" \
            '{
              repo_full_name: $repo,
              head_sha: $sha,
              summary: $summary,
              risk: "low",
              prompt: "ci: kprompt workflow stub",
              pipeline_kind: "github_actions",
              pipeline_ref: ".github/workflows/ci.yml",
              plan_result: {
                schema: "kprompt.planresult.stub/v1",
                intent: "report",
                risk: "low",
                summary: $summary,
                mutating: false,
                source: "github-actions"
              }
            }')
          curl -fsS -X POST "${API_URL}/v1/ci/planresults" \
            -H "Authorization: Bearer ${KPROMPT_ORG_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}"
          echo "uploaded PlanResult for ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
