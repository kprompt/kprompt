name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_e2e_tests:
        description: "Run full e2e suite (default: smoke subset)"
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame and new-code analysis
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with coverage
        run: go test -json -coverprofile=coverage.out -covermode=atomic ./... > report.json || true
      - name: Build
        run: go build -o bin/kprompt ./cmd/kprompt
      # Requires Automatic Analysis disabled on SonarCloud (Project → Administration → Analysis Method).
      # CI-based analysis cannot run while Autoscan is enabled.
      # Skipped for forks and Dependabot PRs: GitHub does not expose SONAR_TOKEN
      # to those runs, so the scan would fail on a missing token.
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        if: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Kind + kubectl e2e smoke (issue #47). Separate from unit/Sonar so PR unit
  # feedback stays fast. Full suite via workflow_dispatch input "full".
  e2e:
    needs: test
    runs-on: ubuntu-latest
    # Dependabot PRs do not need a live cluster; keep Actions minutes for product PRs.
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: "v1.33.1"
      - name: Install kind
        run: |
          set -euo pipefail
          KIND_VERSION=v0.29.0
          curl -fsSL -o ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  kind" | sha256sum -c -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - name: E2E smoke
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_full_e2e_tests == 'smoke' }}
        run: >
          go test -tags=e2e ./test/e2e/
          -run 'TestGenericReadMatrixOnKind|TestDeployRedisOnKind|TestAgentWatchPodsEvents'
          -count=1 -v -timeout 10m
      - name: E2E full
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_e2e_tests == 'full' }}
        run: go test -tags=e2e ./test/e2e/ -count=1 -v -timeout 15m

  # Team SCM demo (A-065 / A-069): stub PlanResult upload when org token is set.
  # Never applies to a cluster. Skips cleanly without KPROMPT_ORG_TOKEN.
  report-plan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Upload PlanResult to kprompt Team
        env:
          KPROMPT_ORG_TOKEN: ${{ secrets.KPROMPT_ORG_TOKEN }}
          API_URL: ${{ vars.KPROMPT_API_URL || 'https://api.kprompt.ai' }}
        run: |
          if [ -z "${KPROMPT_ORG_TOKEN}" ]; then
            echo "KPROMPT_ORG_TOKEN not set — skip Team PlanResult upload"
            exit 0
          fi
          BODY=$(jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg summary "ci stub plan (${GITHUB_WORKFLOW})" \
            '{
              repo_full_name: $repo,
              head_sha: $sha,
              summary: $summary,
              risk: "low",
              prompt: "ci: kprompt workflow stub",
              pipeline_kind: "github_actions",
              pipeline_ref: ".github/workflows/ci.yml",
              plan_result: {
                schema: "kprompt.planresult.stub/v1",
                intent: "report",
                risk: "low",
                summary: $summary,
                mutating: false,
                source: "github-actions"
              }
            }')
          curl -fsS -X POST "${API_URL}/v1/ci/planresults" \
            -H "Authorization: Bearer ${KPROMPT_ORG_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}"
          echo "uploaded PlanResult for ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
