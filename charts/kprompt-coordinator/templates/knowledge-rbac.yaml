{{- if .Values.knowledge.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kprompt-coordinator.fullname" . }}-knowledge
  labels:
    {{- include "kprompt-coordinator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kprompt-coordinator-knowledge"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kprompt-coordinator.fullname" . }}-knowledge
  labels:
    {{- include "kprompt-coordinator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kprompt-coordinator.fullname" . }}-knowledge
subjects:
  - kind: ServiceAccount
    name: {{ include "kprompt-coordinator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
