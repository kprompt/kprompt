image:
  repository: ghcr.io/kprompt/kprompt
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  # AG-039: default is SA-only — no ClusterRole (no cluster-wide pod/Secret reads).
  clusterRole:
    create: false
  # AG-051: optional read-only probe into named namespaces (Pods + Events get/list).
  # Empty = no RoleBindings; Coordinator stays NopProbe unless probe.enabled.
  probeNamespaces: []

probe:
  # AG-050: pass --probe-kube --in-cluster to the Coordinator container.
  enabled: false

knowledge:
  # AG-060: persist Shared Knowledge handoff ring in ConfigMap (restart-safe).
  # Still not a full continuous blast-radius product graph.
  enabled: true

# RT-009…RT-011: continuous correlation (opt-in; never silent heal).
continuous:
  # Proactive tick interval (e.g. 5m). Empty / 0s → off.
  tickInterval: ""
  tickBudget: 5
  maxHops: 3
  # Mark blast-radius mesh/OTel enrichment available; else status=degraded (RT-010).
  meshOTel: false

service:
  type: ClusterIP
  port: 9090

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

replicaCount: 1

networkPolicy:
  # WARNING: Do not enable until kubeAPIServerCIDRs match your topology.
  # Hardening guide: docs/security/operator-endpoint-hardening.md (SEC-007).
  enabled: false
  allowDNS: true
  allowKubeApi: true
  # Example: ["10.96.0.1/32"]
  kubeAPIServerCIDRs: []
  # Raw additional egress rules if needed.
  extraEgress: []
