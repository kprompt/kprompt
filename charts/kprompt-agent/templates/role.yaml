{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kprompt-agent.fullname" . }}
  namespace: {{ include "kprompt-agent.watchNamespace" . }}
  labels:
    {{- include "kprompt-agent.labels" . | nindent 4 }}
rules:
  # Observe Mode — read/watch only (ADR-0013). No create/update/patch/delete.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps", "services", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  {{- if eq (.Values.agent.memoryBackend | default "configmap") "configmap" }}
  # Namespace memory ConfigMap (AG-015) — facts only; not a control-plane upload.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kprompt-namespace-memory"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- end }}
  {{- if and .Values.agent.patterns (eq (.Values.agent.patternsBackend | default "configmap") "configmap") }}
  # Incident patterns ConfigMap (AG-016 / AG-054).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kprompt-incident-patterns"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- end }}
  {{- if eq (.Values.agent.incidentsBackend | default "configmap") "configmap" }}
  # Durable incident state (AG-032).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kprompt-incident-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- end }}
  {{- if .Values.agent.gitopsEvidence }}
  # GitOps evidence (AG-035) — Applications / Kustomizations in the watch namespace only.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.agent.remediationPolicy }}
  # RemediationPolicy ConfigMap (AG-040) — read policy.json.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kprompt-remediation-policy"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Values.agent.autopilotApply }}
  # Autopilot apply verbs (AG-042) — only when explicitly enabled; still namespace Role.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  {{- end }}
  {{- if .Values.agentCR.name }}
  # Status-only write on the opted-in KpromptAgent (AG-013). No workload mutate.
  - apiGroups: ["kprompt.ai"]
    resources: ["kpromptagents", "kpromptagents/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  {{- end }}
{{- end }}
