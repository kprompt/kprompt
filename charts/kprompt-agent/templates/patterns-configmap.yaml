{{- if and .Values.agent.patterns (eq (.Values.agent.patternsBackend | default "configmap") "configmap") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kprompt-incident-patterns
  namespace: {{ include "kprompt-agent.watchNamespace" . }}
  labels:
    {{- include "kprompt-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: incident-memory
data:
  patterns.json: |
    {
      "apiVersion": "kprompt.io/v1",
      "kind": "IncidentPatterns",
      "schemaVersion": "1",
      "namespace": {{ include "kprompt-agent.watchNamespace" . | quote }},
      "patterns": []
    }
{{- end }}
