# Target namespace for the agent Deployment / RBAC.
# Empty → use the Helm release namespace (--namespace).
watchNamespace: ""

image:
  repository: ghcr.io/kprompt/kprompt
  # Empty → Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Observe Mode by default — Autopilot apply is not enabled by this chart.
# --autopilot-propose (below) is propose-only (ADR-0015); never silent apply.
agent:
  analyze: true
  fetchLogs: true
  health: true
  # Prefer LLM when provider secrets exist; set true for offline demos.
  heuristic: false
  discord: false
  slack: false
  webhook: false
  # AG-015: discover deps into analyzer context (file or configmap backend).
  memory: true
  # In-cluster default is configmap so Incident Memory survives pod restarts (AG-054).
  memoryBackend: configmap # file | configmap
  # AG-016: learn signatures; boost confidence on seen-before (never mutates).
  patterns: true
  patternsBackend: configmap # file | configmap
  # AG-017 / ADR-0015: emit AutopilotProposal only — does not apply.
  autopilotPropose: false
  # AG-042: in-loop apply (requires autopilotMode=policyAuto + RemediationPolicy apply=true).
  autopilotApply: false
  # RT-005: RemediationPolicy mode (proposeOnly | policyAuto). policyAuto alone does not enable apply.
  autopilotMode: proposeOnly
  # RT-005: narrow default allowlist — rollback only unless you widen explicitly.
  autopilotAllow:
    - rollbackFailedRollout
  autopilotMinConfidence: "0.85"
  # RT-007: durable proposal store when autopilotPropose (file|configmap).
  proposalsBackend: configmap
  # AG-040: create kprompt-remediation-policy ConfigMap (also auto when autopilotPropose/Apply).
  remediationPolicy: false
  # AG-032 / AG-054: persist incidents across restarts (file|configmap|"").
  incidentsBackend: configmap
  # AG-035: Argo/Flux EvidenceRefs (opt-in; adds Role rules for Applications/Kustomizations).
  gitopsEvidence: false
  minSeverity: medium
  minConfidence: "0.7"
  provider: openai
  model: ""
  # Extra args appended to `kprompt agent run`
  extraArgs: []

# Credentials must come from a Secret (ADR-0013). Prefer an existing Secret.
secret:
  # If true, create an empty Secret shell (you still must patch keys).
  create: false
  name: kprompt-agent
  # Optional stringData when create=true (do not commit real values).
  stringData: {}
  #   OPENAI_API_KEY: ""
  #   KPROMPT_DISCORD_WEBHOOK_URL: ""
  #   KPROMPT_SLACK_BOT_TOKEN: ""
  #   KPROMPT_SLACK_CHANNEL: ""
  #   KPROMPT_SLACK_WEBHOOK_URL: ""
  #   KPROMPT_WEBHOOK_URL: ""

# Map common secret keys into process env for the agent binary.
envFromSecret: true

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels:
  app.kubernetes.io/component: observe-agent

# Optional: sync health + lastAlert onto a KpromptAgent CR (AG-013).
# CRD installs from charts/kprompt-agent/crds/ on helm install.
# Apply a CR from config/samples/kpromptagent.yaml (or templates below).
agentCR:
  name: ""
  # Empty → watchNamespace / release namespace
  namespace: ""
  # When true and name is set, also create the KpromptAgent CR from values.
  create: false
  mode: Observe
  watches: []
  llm:
    provider: openai
    model: ""
    heuristic: false
  notify:
    discord: false
    slack: false
    webhook: false
  severity:
    minimum: medium
    minConfidence: 0.7
  fetchLogs: true
  health: true


networkPolicy:
  # WARNING: Do not enable networkPolicy.enabled=true until you have configured the required CIDRs and ports below for your environment (kubeAPIServerCIDRs, llmCIDRs, etc.). Enabling this policy with empty CIDR lists will block egress to the Kubernetes API server and LLM endpoints, causing the agent to fail.
  # Hardening guide: docs/security/operator-endpoint-hardening.md (SEC-007 Decision A).
  enabled: false
  # Allow DNS egress to cluster DNS pods.
  allowDNS: true

  # Allow Kubernetes API egress only when kubeAPIServerCIDRs is set.
  allowKubeApi: true
  # Example: ["10.96.0.1/32"]
  # Required for explicit kube-apiserver allowlisting when networkPolicy is enabled.
  kubeAPIServerCIDRs: []

  # Operator-managed endpoint CIDRs (Decision A: no automatic private-range blocking).
  # See docs/security/operator-endpoint-hardening.md — List of CIDR blocks for LLM provider endpoints
  llmCIDRs: []
  llmPort: 443
  # Additional ports for self-hosted or custom LLM endpoints (defaults to 443) Examples: 8080, 11434 (Ollama), 8000 (vLLM)
  llmExtraPorts: []

  observabilityCIDRs: []
  webhookCIDRs: []

  # Optional additional ports for observability/webhooks.
  observabilityExtraPorts: []
  webhookExtraPorts: []

  # Raw additional egress rules if needed.
  extraEgress: []

